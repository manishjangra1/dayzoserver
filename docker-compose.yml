version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dayzo_postgres
    environment:
      POSTGRES_USER: dayzo_user
      POSTGRES_PASSWORD: dayzo_password
      POSTGRES_DB: dayzo_db
    ports:
      - "5432:5432"
    volumes:
      - dayzo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dayzo_redis
    ports:
      - "6380:6379" # Bound to 6380 to avoid conflicts with other active Redis containers like sahaayikaa-server-redis-1
    restart: unless-stopped

volumes:
  dayzo_postgres_data:
